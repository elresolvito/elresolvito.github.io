name: Optimizar y Comprimir Imágenes

on:
  push:
    paths:
      - '**.jpg'
      - '**.jpeg'
      - '**.png'
      - '**.webp'
      - '**.JPG'
      - '**.PNG'

jobs:
  build:
    name: Comprimir imágenes automáticamente
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar compresor de imágenes
        uses: calibreapp/image-actions@main
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          jpegQuality: '85'
          pngQuality: '80'
          webpQuality: '85'

      - name: Guardar cambios optimizados
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'Optimización automática de peso de imágenes'
